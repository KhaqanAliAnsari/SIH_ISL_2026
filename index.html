<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SignKYC V-CIP Console</title>
    <link rel="preconnect" href="https://storage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="dns-prefetch" href="https://storage.googleapis.com" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML += '<div style="color:red; font-size:20px; padding:20px; z-index:9999; position:absolute; top:0; left:0; background:white;">Error: ' + message + '<br>' + source + ':' + lineno + '</div>';
      };
      window.addEventListener('unhandledrejection', function(event) {
        document.body.innerHTML += '<div style="color:red; font-size:20px; padding:20px; z-index:9999; position:absolute; top:0; left:0; background:white;">Unhandled Promise Rejection: ' + event.reason + '</div>';
      });
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 dark antialiased selection:bg-sky-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
